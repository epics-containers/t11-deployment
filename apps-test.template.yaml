# Template for the root app of a test deployment of t11 into your own
# namespace (issue #3).
#
# Do not edit this file. Run ./make-apps-test.py to write apps-test.local.yaml
# with your values, then run:
#   module load <argocd-cluster>
#   kubectl apply -n <namespace> -f apps-test.local.yaml
#
# This Jinja2 template is also valid YAML, because every expression is inside
# a quoted string. YAML would read a bare expression as a mapping. A line
# that starts with #% is a Jinja2 statement, which YAML reads as a comment.
# The filter statement replaces the example port 8080 with your port, which
# must stay a bare integer.
#
# You do not need to fork this repo: these values live in the Application on
# the cluster. Fork t11-services only if you change IOCs or other services,
# and give the script your fork's URL.
#
# To tear down, delete this Application. A PostDelete hook then deletes the
# PVCs that Argo CD kept for the t11 services. Other PVCs are not touched.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: t11
  # the root app lives in your namespace, as at DLS
  namespace: "{{ namespace }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  # at DLS the Argo CD project has the same name as your namespace
  project: "{{ namespace }}"
  destination:
    # the cluster where Argo CD creates the child Applications
    name: "{{ argocd_cluster }}"
    # must match metadata.namespace: the child Applications are created here
    namespace: "{{ namespace }}"
  source:
    path: apps
    repoURL: https://github.com/epics-containers/t11-deployment
    targetRevision: "{{ revision }}"
    helm:
      version: v3
      valuesObject:
        # the project, cluster and namespace for the t11 services
        project: "{{ namespace }}"
        destination:
          name: "{{ target_cluster }}"
          namespace: "{{ namespace }}"
        source:
          repoURL: "{{ services_repo }}"
          targetRevision: main

        testBeamline:
          enabled: true
          # your own uid and gid, as strings, which the chart accepts. Delete
          # both lines to keep the production account.
          uid: "{{ uid }}"
          gid: "{{ gid }}"
          # uncomment teardown and the settings you need. An empty
          # teardown is null, which removes the chart defaults and the hook.
          # teardown:
            # uncomment to use an existing ServiceAccount that can delete
            # PVCs, if you cannot create a Role and RoleBinding
            # serviceAccountName: default-full-access-mounted
            # uncomment to log what would be deleted without deleting
            # dryRun: true

        #% if non_dls
        # per-service changes, e.g. remove a service
        services:
          t11-epics-opis:
            valuesObject:
              service:
                # the OPI chart serves on service.port, default 80. K3s
                # servicelb serves each LoadBalancer port as a hostPort on
                # every node, so port 80 clashes with an ingress controller.
                #% filter replace("8080", opi_port)
                port: 8080
                #% endfilter
          # t11-tiled:
          #   removed: true
        #% else
        # optional per-service changes, e.g. remove a service
        # services:
        #   t11-tiled:
        #     removed: true
        #% endif
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
