# Template for the root app of a test deployment of t11 into your own
# namespace (issue #3).
#
# Do not edit this file. Run scripts/make-apps-test.py to write apps-test.local.yaml
# with your values, then run:
#   module load <argocd-cluster>
#   kubectl apply -n <namespace> -f apps-test.local.yaml
#
# This Jinja2 template is also valid YAML, because every expression is inside
# a quoted string. YAML would read a bare expression as a mapping.
#
# You do not need to fork this repo: these values live in the Application on
# the cluster. Fork t11-services only if you change IOCs or other services,
# and give the script your fork's URL.
#
# To tear down, delete this Application. A PostDelete hook then deletes the
# PVCs that Argo CD kept for the t11 services. Other PVCs are not touched.
# Unless you turn off testBeamline.idleTeardown, a CronJob deletes this
# Application for you after 24 hours with no change to any t11 app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: t11
  # the root app lives in your namespace, as at DLS
  namespace: "{{ namespace }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  # at DLS the Argo CD project has the same name as your namespace
  project: "{{ namespace }}"
  destination:
    # the cluster where Argo CD creates the child Applications
    name: "{{ argocd_cluster }}"
    # must match metadata.namespace: the child Applications are created here
    namespace: "{{ namespace }}"
  source:
    path: apps
    repoURL: https://github.com/epics-containers/t11-deployment
    targetRevision: "{{ revision }}"
    helm:
      version: v3
      valuesObject:
        # the project, cluster and namespace for the t11 services
        project: "{{ namespace }}"
        destination:
          name: "{{ target_cluster }}"
          namespace: "{{ namespace }}"
        source:
          repoURL: "{{ services_repo }}"
          targetRevision: main

        testBeamline:
          enabled: true
          # your own uid and gid, as strings, which the chart accepts. Delete
          # both lines to keep the production account.
          uid: "{{ uid }}"
          gid: "{{ gid }}"
          # delete this root app, and so the whole test beamline, after
          # idleHours with no change to any t11 app. Set enabled: false to
          # keep a permanent test beamline
          idleTeardown:
            enabled: true
            idleHours: 24
          # uncomment teardown and the settings you need. An empty
          # teardown is null, which removes the chart defaults and the hook.
          # teardown:
          #   # use an existing ServiceAccount that can delete PVCs, if you
          #   # cannot create a Role and RoleBinding
          #   serviceAccountName: default-full-access-mounted
          #   # log what would be deleted without deleting
          #   dryRun: true

        # optional per-service changes, e.g. remove a service
        # services:
        #   t11-tiled:
        #     removed: true
        #   # outside DLS: K3s servicelb serves each LoadBalancer port on every
        #   # node, so the OPI port 80 clashes with an ingress controller.
        #   # Uncomment services: and these lines to use another port. Do not
        #   # use 8080, which t11-keycloak needs.
        #   t11-epics-opis:
        #     valuesObject:
        #       service:
        #         port: 8081
        #   # the blueapi oauth2-proxy port 80 clashes in the same way
        #   t11-blueapi:
        #     valuesObject:
        #       oauth2:
        #         service:
        #           portNumber: 8082
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
