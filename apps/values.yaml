# yaml-language-server: $schema=https://github.com/epics-containers/ec-helm-charts/releases/download/5.11.0/argocd-apps.schema.json

# This file configures an ArgoCD app of apps that represent a
# group of beamline or accelerator IOCs and services. The configuration of the
# services are in the separate repo indicated by repoURL.

# This repository only controls which services and which versions of those
# services should be running on the cluster. It is recommended that this repo
# be updated by a CI/CD pipeline or configuration tools only.

project: t11-beamline
destination:
  name: argus
  namespace: t11-beamline
source:
  repoURL: https://github.com/epics-containers/t11-services
  targetRevision: main

# Opt-in profile for a test deployment of the beamline (issue #3).
# Leave disabled here. Enable it in the valuesObject of your root app, see
# apps-test.yaml. See apps/templates/_test_beamline.tpl for how it works.
testBeamline:
  enabled: false
  # optional: run as this uid:gid instead of the production account
  uid:
  gid:
  # the values paths where the service charts set a securityContext. Add a
  # path when a new chart pins the production account.
  # container level: gets runAsUser and runAsGroup
  securityContextPaths:
    - ioc-instance.securityContext
  # Pod level: also gets fsGroup, so shared volumes are writable by gid
  podSecurityContextPaths:
    - ioc-instance.podSecurityContext
    # the gateway chart renders securityContext at Pod level
    - epics-gateways.securityContext
  # when you delete the root app, a PostDelete hook deletes the PVCs that
  # Argo CD kept for its child apps. Other PVCs in the namespace are kept.
  teardown:
    deletePvcs: true
    # true: log what would be deleted, delete nothing
    dryRun: false
    # empty: create a ServiceAccount, Role and RoleBinding for the hook
    # set: run the hook as this existing ServiceAccount and create no RBAC
    serviceAccountName: ""
    # optional label selector that narrows the PVCs considered
    pvcSelector: ""
    # needs a shell as well as kubectl
    image: docker.io/alpine/k8s:1.34.11
  # delete the root app, and so the whole test beamline, when none of its
  # apps has changed for idleHours. apps-test.template.yaml turns it on; set
  # enabled: false in your root app to keep a test beamline, as apps.yaml does
  # for the reference deployment. See apps/templates/test_beamline_idle_teardown.yaml.
  idleTeardown:
    enabled: false
    idleHours: 24
    # when to check, as a CronJob schedule
    schedule: "7 * * * *"
    # true: log the decision, delete nothing
    dryRun: false
    # empty: create a ServiceAccount, Role and RoleBinding for the CronJob
    # set: run it as this existing ServiceAccount and create no RBAC
    serviceAccountName: ""
    # needs a shell as well as kubectl
    image: docker.io/alpine/k8s:1.34.11

services:
  # Each item is of the form:
  #   service: service name as it appears in K8S (statefulset/deployment name)
  #     targetRevision: optional override for targetRevision above
  #     repoURL: optional override for git repo to source the helm chart from
  #            the path is always services/<service> within that repo
  #     removed: set to true to remove the service from the cluster
  #     removed: set to true to remove the service from the cluster
  #     ---- fields for ioc-instance (and other future cooperating charts)
  #     enabled: set to false to stop a service
  #     labels: custom labels to apply to the service resources
  #     description: free text shown by `ec ps` and argocd-monitor
  #     values: TBA - custom values to pass to the helm chart when deploying the service
  #     ----

  t11-epics-pvcs:
    description: Shared volumes for IOC data, config and runtime files
  t11-epics-opis:
    description: Web server for the beamline's Phoebus OPI screens
  t11-epics-gateways:
    description: CA and PVA gateways into the beamline IOCs
  t11-blueapi:
    description: Bluesky REST API for running plans
  t11-keycloak:
    description: Local identity provider for test users
  t11-numtracker:
    description: Scan number and data path service
  t11-opa:
    description: Policy engine that authorises blueapi requests
  t11-rabbitmq:
    description: Message bus for blueapi events
  t11-tiled:
    description: Data server that stores and serves scan data

  bl11t-synoptic:
    description: Generated synoptic and component screens
  bl11t-di-cam-01:
    description: Simulated area detector camera
  bl11t-ea-test-01:
    description: Test IOC with A, B and SUM PVs
  bl11t-mo-sim-01:
    description: Simulation of 2 motors
