{{- /*
Teardown for a test beamline (issue #3).

Some charts annotate their PVCs with argocd.argoproj.io/sync-options:
Delete=false or helm.sh/resource-policy: keep. Argo CD reads those annotations
from the live PVC, so no Application setting can override them.

The Job deletes only PVCs whose argocd.argoproj.io/tracking-id names one of
this root app's child apps. A namespace may hold other work, e.g. another
beamline's PVCs, and the Job keeps those. teardown.pvcSelector narrows the
PVCs further, and teardown.dryRun logs what would be deleted without deleting.
Argo CD instances that use label-only resource tracking set no tracking-id,
so there the Job deletes nothing.

These resources are PostDelete hooks. Argo CD creates them only after it has
deleted the child Applications and their Pods, so the Job can delete the PVCs
at once.

Argo CD version notes:
  - 2.13 or later is required. Earlier releases fail on hooks with no health
    check, such as the ServiceAccount, Role and RoleBinding.
  - The Job has hook-delete-policy HookSucceeded, so every release removes it
    and the next teardown runs again. The RBAC hooks have no policy: before
    3.3 they stay in the namespace and are reused next time, and from 3.3
    Argo CD removes them. HookSucceeded on the RBAC hooks can leave the app
    stuck in Deleting on older releases (argoproj/argo-cd#17191).

The Job tries each PVC delete three times. A PVC that still fails is logged,
and the Job still succeeds, so the root app does not stay stuck in Deleting.
Only a failure to list the PVCs fails the Job: Argo CD then retries it and
the root app stays in deletion until the Job succeeds.
*/ -}}
{{- $tb := default dict .Values.testBeamline -}}
{{- $teardown := default dict $tb.teardown -}}
{{- if and $tb.enabled $teardown.deletePvcs }}
{{- $namespace := .Values.destination.namespace | required "destination.namespace is required" }}
{{- $serviceAccount := default "t11-test-beamline-teardown" $teardown.serviceAccountName }}
{{- if not $teardown.serviceAccountName }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccount }}
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $serviceAccount }}
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $serviceAccount }}
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $serviceAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ $namespace }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: t11-test-beamline-teardown
  namespace: {{ $namespace }}
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  # Argo CD creates the RBAC hooks in the same pass, so allow a retry
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: {{ $serviceAccount }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ int64 (default 65534 $tb.uid) }}
        runAsGroup: {{ int64 (default 65534 $tb.gid) }}
      containers:
        - name: delete-pvcs
          # needs a shell as well as kubectl
          image: {{ default "docker.io/alpine/k8s:1.34.11" $teardown.image }}
          command: [sh, -c]
          args:
            - |
              set -u
              echo "t11 teardown in namespace $NAMESPACE (dry run: $DRY_RUN)"
              echo "child apps: $APPS"
              failed=0
              # one line per PVC: <name>|<argocd tracking id>
              kubectl get persistentvolumeclaims --namespace "$NAMESPACE" \
                  ${SELECTOR:+--selector "$SELECTOR"} \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.metadata.annotations.argocd\.argoproj\.io/tracking-id}{"\n"}{end}' \
                  > /tmp/pvcs || exit 1
              while IFS='|' read -r pvc tracking; do
                [ -n "$pvc" ] || continue
                owner=""
                for app in $APPS; do
                  # Argo CD names the app instance <app>, or <namespace>_<app>
                  # when the Application is outside its own namespace
                  for instance in "$app" "${APP_NAMESPACE}_$app"; do
                    if [ "$tracking" = "$instance:/PersistentVolumeClaim:$NAMESPACE/$pvc" ]; then
                      owner=$app
                    fi
                  done
                done
                if [ -z "$owner" ]; then
                  echo "keep   $pvc (not tracked by a t11 app: '${tracking}')"
                elif [ "$DRY_RUN" = "true" ]; then
                  echo "would delete $pvc (tracked by $owner)"
                else
                  echo "delete $pvc (tracked by $owner)"
                  # retry a transient API failure before the PVC counts as failed
                  for attempt in 1 2 3; do
                    kubectl delete persistentvolumeclaim "$pvc" --namespace "$NAMESPACE" \
                        --wait=false --ignore-not-found && break
                    if [ "$attempt" = 3 ]; then
                      failed=1
                    else
                      sleep 5
                    fi
                  done
                fi
              done < /tmp/pvcs
              # a failed Job would leave the root app stuck in Deleting, so
              # report failures but still succeed
              [ "$failed" = 0 ] || echo "WARNING: some PVCs were not deleted, see above"
          env:
            - name: NAMESPACE
              value: {{ $namespace | quote }}
            # the child Applications live in the root app's namespace
            - name: APP_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            # every service, including removed ones whose kept PVCs remain
            - name: APPS
              value: {{ keys (default dict .Values.services) | sortAlpha | join " " | quote }}
            - name: SELECTOR
              value: {{ default "" $teardown.pvcSelector | quote }}
            - name: DRY_RUN
              value: {{ ternary "true" "false" (eq (toString $teardown.dryRun) "true") | quote }}
            # kubectl writes its cache under HOME
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
