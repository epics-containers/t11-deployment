# DLS creates this ServiceAccount in every namespace. The t11 gateways use
# it to discover Pods and Services.
#
# Keep every namespace below equal: kustomize replaces them all with the
# namespace in kustomization.yaml only while they match.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default-full-access-mounted
  namespace: t11-beamline
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-discovery
  namespace: t11-beamline
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-discovery
  namespace: t11-beamline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-discovery
subjects:
  - kind: ServiceAccount
    name: default-full-access-mounted
    namespace: t11-beamline
